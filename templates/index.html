<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='icon/icon.jpeg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Ditherix</title>
</head>

<body>
    <main class="visor" id="visor">
        <div class="menu-flotante" id="menuImagen">
            <nav class="glass-bar top-bar" aria-label="Menú principal">
                <div class="bar-items">
                    <a href="/" class="glass-control" title="Volver al Portal"
                        style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">
                        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                            fill="#e3e3e3">
                            <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z" />
                        </svg>
                    </a>
                    <button class="glass-control" id="botonExportar" type="button" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                            fill="#e3e3e3">
                            <path
                                d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z" />
                        </svg>
                    </button>
                    <button class="glass-control" id="botonCargar" type="button" aria-controls="imageInput">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                            fill="#e3e3e3">
                            <path
                                d="M440-200h80v-167l64 64 56-57-160-160-160 160 57 56 63-63v167ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z" />
                        </svg>
                    </button>
                </div>
                <input class="oculto" type="file" id="imageInput" accept="image/jpeg,image/png,image/webp">
            </nav>

            <nav class="glass-bar bottom-bar" aria-label="Herramientas de imagen">
                <div class="bar-items">
                    <button class="glass-control" id="btn-toggle-edit" type="button" aria-controls="edit-menu"
                        aria-expanded="false" title="Ajustes de edición">
                        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                            fill="currentColor">
                            <path
                                d="M440-120v-240h80v80h320v80H520v80h-80Zm-320-80v-80h240v80H120Zm160-160v-80H120v-80h160v-80h80v240h-80Zm160-80v-80h400v80H440Zm160-160v-240h80v80h160v80H680v80h-80Zm-480-80v-80h400v80H120Z" />
                        </svg>
                    </button>
                    <button class="glass-control" id="btn-toggle-color" type="button" aria-controls="color-menu"
                        aria-expanded="false" title="Balance y Mezcla de Colores (HSL)">
                        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                            fill="currentColor">
                            <path
                                d="M480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-83 31.5-156t86-127Q252-817 325-848.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm-180-280q25 0 42.5-17.5T360-500q0-25-17.5-42.5T300-560q-25 0-42.5 17.5T240-500q0 25 17.5 42.5T300-440Zm120-140q25 0 42.5-17.5T480-640q0-25-17.5-42.5T420-700q-25 0-42.5 17.5T360-640q0 25 17.5 42.5T420-580Zm180 0q25 0 42.5-17.5T660-640q0-25-17.5-42.5T600-700q-25 0-42.5 17.5T540-640q0 25 17.5 42.5T600-580Zm120 140q25 0 42.5-17.5T780-500q0-25-17.5-42.5T720-560q-25 0-42.5 17.5T660-500q0 25 17.5 42.5T720-440Z" />
                        </svg>
                    </button>
                    <button class="glass-control" id="btn-toggle-detalle" type="button" aria-controls="detalle-menu"
                        aria-expanded="false" title="Ajustes de detalle">
                        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                            fill="currentColor">
                            <path
                                d="M176-120q-19-4-35.5-20.5T120-176l664-664q21 5 36 20.5t21 35.5L176-120Zm-56-252v-112l356-356h112L120-372Zm0-308v-80q0-33 23.5-56.5T200-840h80L120-680Zm560 560 160-160v80q0 33-23.5 56.5T760-120h-80Zm-308 0 468-468v112L484-120H372Z" />
                        </svg>
                    </button>
                    <button class="glass-control" id="btn-toggle-dither" type="button" aria-controls="dither-menu"
                        aria-expanded="false" title="Dithering y Estilo Retro">
                        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                            fill="currentColor">
                            <path
                                d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h160v-160H200v160Zm240 0h160v-160H440v160Zm240 0h80v-80H680v80Zm0-160h80v-160H680v160Zm-240 0h160v-160H440v160Zm-240 0h160v-160H200v160Zm0-240h80v-80H200v80Zm160 0h160v-160H360v160Zm240 0h160v-160H600v160Z" />
                        </svg>
                    </button>
                    <button class="glass-control" id="btn-toggle-marcos" type="button" aria-controls="marcos-menu"
                        aria-expanded="false" title="Marcos decorativos">
                        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                            fill="currentColor">
                            <path
                                d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm80-80h400v-400H280v400Zm-80 80v-560 560Z" />
                        </svg>
                    </button>
                    <div class="crop-popover-container">
                        <button id="btn-iniciar-recorte" class="glass-control" type="button" title="Recorte" disabled
                            aria-expanded="false" aria-controls="crop-menu">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                                fill="#e3e3e3">
                                <path
                                    d="M760-120 480-400l-94 94q8 15 11 32t3 34q0 66-47 113T240-80q-66 0-113-47T80-240q0-66 47-113t113-47q17 0 34 3t32 11l94-94-94-94q-15 8-32 11t-34 3q-66 0-113-47T80-720q0-66 47-113t113-47q66 0 113 47t47 113q0 17-3 34t-11 32l494 494v40H760ZM600-520l-80-80 240-240h120v40L600-520ZM296.5-663.5Q320-687 320-720t-23.5-56.5Q273-800 240-800t-56.5 23.5Q160-753 160-720t23.5 56.5Q207-640 240-640t56.5-23.5ZM494-466q6-6 6-14t-6-14q-6-6-14-6t-14 6q-6 6-6 14t6 14q6 6 14 6t14-6ZM296.5-183.5Q320-207 320-240t-23.5-56.5Q273-320 240-320t-56.5 23.5Q160-273 160-240t23.5 56.5Q207-160 240-160t56.5-23.5Z" />
                            </svg>
                        </button>
                        <div id="crop-menu" class="crop-menu hidden" aria-label="Opciones de recorte">
                            <button id="btn-confirmar-recorte" class="glass-control crop-action-btn" type="button"
                                disabled title="Aplicar recorte">
                                <svg xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 -960 960 960"
                                    width="16px" fill="currentColor">
                                    <path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z" />
                                </svg>
                                <span>Aplicar</span>
                            </button>
                            <button id="btn-cancelar-recorte" class="glass-control crop-action-btn" type="button"
                                disabled title="Cancelar recorte">
                                <svg xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 -960 960 960"
                                    width="16px" fill="currentColor">
                                    <path
                                        d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
                                </svg>
                                <span>Cancelar</span>
                            </button>
                            <button id="btn-restablecer-recorte" class="glass-control crop-action-btn" type="button"
                                disabled title="Restablecer tamaño original">
                                <svg xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 -960 960 960"
                                    width="16px" fill="currentColor">
                                    <path
                                        d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z" />
                                </svg>
                                <span>Restablecer tamaño</span>
                            </button>
                        </div>
                    </div>
                    <button class="glass-control" id="botonVoltearHorizontal" type="button" disabled><svg
                            xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                            fill="#e3e3e3">
                            <path
                                d="M280-160 80-360l200-200 56 57-103 103h287v80H233l103 103-56 57Zm400-240-56-57 103-103H440v-80h287L624-743l56-57 200 200-200 200Z" />
                        </svg></button>
                    <button class="glass-control" id="botonVoltearVertical" type="button" disabled><svg
                            xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                            fill="#e3e3e3">
                            <path
                                d="M320-440v-287L217-624l-57-56 200-200 200 200-57 56-103-103v287h-80ZM600-80 400-280l57-56 103 103v-287h80v287l103-103 57 56L600-80Z" />
                        </svg></button>
                </div>
            </nav>
            <!--edicion-->
            <section id="edit-menu" class="edit-panel hidden" aria-label="Ajustes de edición" aria-hidden="true">
                <div class="edit-header">
                    <h2>Edición</h2>
                    <button class="close-btn" id="btn-close-edit" type="button" aria-label="Cerrar ajustes">
                        &times;
                    </button>
                </div>

                <div class="slider-group">
                    <label for="brilloInput">Brillo <output id="brilloValor" for="brilloInput">0%</output></label>
                    <input id="brilloInput" type="range" min="-100" max="100" step="1" value="0"
                        aria-label="Nivel de brillo" disabled>
                </div>

                <div class="slider-group">
                    <label for="contrasteInput">Contraste <output id="contrasteValor"
                            for="contrasteInput">0%</output></label>
                    <input id="contrasteInput" type="range" min="-100" max="100" step="1" value="0"
                        aria-label="Nivel de contraste" disabled>
                </div>

                <div class="slider-group">
                    <label for="saturacionInput">Saturación <output id="saturacionValor"
                            for="saturacionInput">0%</output></label>
                    <input id="saturacionInput" type="range" min="-100" max="100" step="1" value="0"
                        aria-label="Nivel de saturación" disabled>
                </div>
                <div class="edit-actions">
                    <button class="glass-control" id="botonResetAjustes" type="button" disabled>Restablecer</button>
                    <button class="glass-control" id="botonAplicarAjustes" type="button" disabled>Aplicar</button>
                </div>
            </section>
            <!--detalle-->
            <section id="detalle-menu" class="edit-panel hidden" aria-label="Ajustes de detalle" aria-hidden="true">
                <div class="edit-header">
                    <h2>Detalle</h2>
                    <button class="close-btn" id="btn-close-detalle" type="button" aria-label="Cerrar detalle">
                        &times;
                    </button>
                </div>

                <div class="slider-group">
                    <label for="desenfoqueInput">Desenfoque <output id="desenfoqueValor"
                            for="desenfoqueInput">0%</output></label>
                    <input id="desenfoqueInput" type="range" min="-100" max="100" step="1" value="0"
                        aria-label="Desenfoque" disabled>
                </div>

                <div class="slider-group">
                    <label for="nitidezInput">Nitidez <output id="nitidezValor" for="nitidezInput">0%</output></label>
                    <input id="nitidezInput" type="range" min="-100" max="100" step="1" value="0" aria-label="Nitidez"
                        disabled>
                </div>

                <div class="slider-group">
                    <label for="granoInput">Grano analógico <output id="granoValor" for="granoInput">0%</output></label>
                    <input id="granoInput" type="range" min="0" max="100" step="1" value="0"
                        aria-label="Grano analógico" disabled>
                </div>
                <div class="edit-actions">
                    <button class="glass-control" id="botonResetDetalle" type="button" disabled>Restablecer</button>
                    <button class="glass-control" id="botonAplicarDetalle" type="button" disabled>Aplicar</button>
                </div>
            </section>
            <!--Dithering-->
            <section id="dither-menu" class="edit-panel hidden" aria-label="Efecto Dithering" aria-hidden="true">
                <div class="edit-header">
                    <h2>Dithering</h2>
                    <button class="close-btn" id="btn-close-dither" type="button" aria-label="Cerrar dithering">
                        &times;
                    </button>
                </div>

                <div class="select-group">
                    <label for="ditherAlgoritmo">Algoritmo</label>
                    <select id="ditherAlgoritmo" class="glass-select" disabled>
                        <option value="ninguno">Ninguno</option>
                        <option value="floyd_steinberg">Floyd-Steinberg (Difusión)</option>
                        <option value="bayer_4">Bayer 4x4 (Trama ordenada)</option>
                        <option value="bayer_8">Bayer 8x8 (Trama fina)</option>
                        <option value="atkinson">Atkinson (Macintosh 1984)</option>
                        <option value="cuantizacion">Cuantización directa (Póster)</option>
                    </select>
                </div>

                <div class="select-group">
                    <label for="ditherPaleta">Paleta de color</label>
                    <select id="ditherPaleta" class="glass-select" disabled>
                        <option value="bn">Monocromo B&N</option>
                        <option value="gameboy">Game Boy</option>
                        <option value="cga">CGA Retro</option>
                        <option value="ambar">Ámbar CRT</option>
                        <option value="cyberpunk">Cyberpunk</option>
                        <option value="matrix">Matrix</option>
                        <option value="vaporwave">Vaporwave</option>
                        <option value="termica">Visión Térmica</option>
                    </select>
                </div>

                <div class="slider-group">
                    <label for="ditherIntensidadInput">Intensidad de mezcla <output id="ditherIntensidadValor"
                            for="ditherIntensidadInput">100%</output></label>
                    <input id="ditherIntensidadInput" type="range" min="0" max="100" step="1" value="100"
                        aria-label="Intensidad de mezcla del dither" disabled>
                </div>

                <div class="slider-group">
                    <label for="ditherPixelInput">Tamaño de píxel <output id="ditherPixelValor" for="ditherPixelInput">1
                            px</output></label>
                    <input id="ditherPixelInput" type="range" min="1" max="8" step="1" value="1"
                        aria-label="Tamaño de píxel retro" disabled>
                </div>

                <div class="edit-actions">
                    <button class="glass-control" id="botonResetDither" type="button" disabled>Restablecer</button>
                    <button class="glass-control" id="botonAplicarDither" type="button" disabled>Aplicar</button>
                </div>
            </section>
            <!-- Balance de Color y Mezcla HSL estilo Lightroom -->
            <section id="color-menu" class="edit-panel hidden" aria-label="Ajustes de color y Mezcla HSL" aria-hidden="true">
                <div class="edit-header">
                    <h2>Color</h2>
                    <button class="close-btn" id="btn-close-color" type="button" aria-label="Cerrar color">
                        &times;
                    </button>
                </div>

                <div class="color-tabs-bar">
                    <button type="button" class="color-tab-btn active" id="tab-btn-balance">Balance</button>
                    <button type="button" class="color-tab-btn" id="tab-btn-mezcla">Mezcla HSL</button>
                </div>

                <!-- Sección 1: Balance de temperatura y tinte -->
                <div id="color-view-balance" class="color-subview">
                    <div class="slider-group">
                        <label for="temperaturaInput">Temperatura <output id="temperaturaValor" for="temperaturaInput">0</output></label>
                        <div class="range-gradient-wrap track-temperatura">
                            <input id="temperaturaInput" type="range" min="-100" max="100" step="1" value="0" aria-label="Temperatura de color" disabled>
                        </div>
                        <div class="color-range-hints">
                            <span class="hint-cold">Azul (Frío)</span>
                            <span class="hint-warm">Ámbar (Cálido)</span>
                        </div>
                    </div>

                    <div class="slider-group">
                        <label for="tinteInput">Tinte <output id="tinteValor" for="tinteInput">0</output></label>
                        <div class="range-gradient-wrap track-tinte">
                            <input id="tinteInput" type="range" min="-100" max="100" step="1" value="0" aria-label="Tinte de color" disabled>
                        </div>
                        <div class="color-range-hints">
                            <span class="hint-green">Verde</span>
                            <span class="hint-magenta">Magenta</span>
                        </div>
                    </div>
                </div>

                <!-- Sección 2: Mezcla HSL de 8 colores -->
                <div id="color-view-mezcla" class="color-subview hidden">
                    <div class="color-swatches-selector" role="radiogroup" aria-label="Canal de color">
                        <button type="button" class="color-swatch-circle active" data-color="rojo" title="Rojo" style="--swatch-hue: #ff3b30;"></button>
                        <button type="button" class="color-swatch-circle" data-color="naranja" title="Naranja" style="--swatch-hue: #ff9500;"></button>
                        <button type="button" class="color-swatch-circle" data-color="amarillo" title="Amarillo" style="--swatch-hue: #ffcc00;"></button>
                        <button type="button" class="color-swatch-circle" data-color="verde" title="Verde" style="--swatch-hue: #34c759;"></button>
                        <button type="button" class="color-swatch-circle" data-color="cyan" title="Cyan" style="--swatch-hue: #32ade6;"></button>
                        <button type="button" class="color-swatch-circle" data-color="azul" title="Azul" style="--swatch-hue: #007aff;"></button>
                        <button type="button" class="color-swatch-circle" data-color="violeta" title="Violeta" style="--swatch-hue: #af52de;"></button>
                        <button type="button" class="color-swatch-circle" data-color="rosa" title="Rosa" style="--swatch-hue: #ff2d55;"></button>
                    </div>

                    <div class="color-active-header">
                        <span class="color-active-indicator" id="colorActiveDot" style="background: #ff3b30;"></span>
                        <span class="color-active-name" id="colorActiveName">Rojo</span>
                    </div>

                    <div class="slider-group">
                        <label for="hslTonoInput">Tono <output id="hslTonoValor" for="hslTonoInput">0</output></label>
                        <input id="hslTonoInput" type="range" min="-100" max="100" step="1" value="0" aria-label="Tono del canal de color" disabled>
                    </div>

                    <div class="slider-group">
                        <label for="hslSatInput">Saturación <output id="hslSatValor" for="hslSatInput">0%</output></label>
                        <input id="hslSatInput" type="range" min="-100" max="100" step="1" value="0" aria-label="Saturación del canal de color" disabled>
                    </div>

                    <div class="slider-group">
                        <label for="hslLumInput">Luminancia <output id="hslLumValor" for="hslLumInput">0%</output></label>
                        <input id="hslLumInput" type="range" min="-100" max="100" step="1" value="0" aria-label="Luminancia del canal de color" disabled>
                    </div>
                </div>

                <div class="edit-actions">
                    <button class="glass-control" id="botonResetColor" type="button" disabled>Restablecer</button>
                    <button class="glass-control" id="botonAplicarColor" type="button" disabled>Aplicar</button>
                </div>
            </section>
            <!-- Marcos Decorativos -->
            <section id="marcos-menu" class="edit-panel hidden" aria-label="Marcos decorativos" aria-hidden="true">
                <div class="edit-header">
                    <h2>Marcos</h2>
                    <button class="close-btn" id="btn-close-marcos" type="button" aria-label="Cerrar marcos">
                        &times;
                    </button>
                </div>

                <div class="select-group">
                    <label for="marcoEstiloSelect">Estilo de marco</label>
                    <select id="marcoEstiloSelect" class="glass-select" disabled>
                        <option value="ninguno">Ninguno</option>
                        <option value="liso">Marco Liso</option>
                        <option value="polaroid">Polaroid Clásico</option>
                        <option value="polaroid_gastado">Polaroid Gastado / Quemado</option>
                        <option value="pelicula">Tira de Película 35mm</option>
                    </select>
                </div>

                <!-- Opciones específicas de Marco Liso -->
                <div id="opcionesMarcoLiso" class="marco-liso-options hidden">
                    <div class="color-picker-group">
                        <label for="marcoColorInput">Color del marco</label>
                        <div class="marco-color-row">
                            <input id="marcoColorInput" type="color" value="#ffffff" class="glass-color-input" disabled>
                            <div class="marco-color-presets">
                                <button type="button" class="preset-color-dot active" data-color="#ffffff" title="Blanco" style="background: #ffffff;"></button>
                                <button type="button" class="preset-color-dot" data-color="#000000" title="Negro" style="background: #000000; border: 1px solid #444;"></button>
                                <button type="button" class="preset-color-dot" data-color="#f5e6c8" title="Crema" style="background: #f5e6c8;"></button>
                                <button type="button" class="preset-color-dot" data-color="#00ff66" title="Cyber Verde" style="background: #00ff66;"></button>
                                <button type="button" class="preset-color-dot" data-color="#ff007f" title="Neón Rosa" style="background: #ff007f;"></button>
                            </div>
                        </div>
                    </div>

                    <div class="slider-group">
                        <label for="marcoGrosorInput">Grosor <output id="marcoGrosorValor" for="marcoGrosorInput">24 px</output></label>
                        <input id="marcoGrosorInput" type="range" min="4" max="100" step="2" value="24"
                            aria-label="Grosor del marco" disabled>
                    </div>
                </div>

                <div class="edit-actions">
                    <button class="glass-control" id="botonResetMarco" type="button" disabled>Quitar marco</button>
                    <button class="glass-control" id="botonAplicarMarco" type="button" disabled>Aplicar</button>
                </div>
            </section>
        </div>
        <p id="mensaje" class="oculto" role="alert" aria-live="assertive"></p>
        <p id="cargando" class="oculto" role="status" aria-live="polite">
            Procesando imagen…
        </p>
        <div class="drop-zone" id="dropZone" role="button" tabindex="0"
            aria-label="Cargar imagen mediante arrastrar y soltar o clic">
            <span class="drop-zone-bracket dz-tl" aria-hidden="true">┌</span>
            <span class="drop-zone-bracket dz-tr" aria-hidden="true">┐</span>
            <span class="drop-zone-bracket dz-bl" aria-hidden="true">└</span>
            <span class="drop-zone-bracket dz-br" aria-hidden="true">┘</span>

            <div class="drop-zone-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" height="42px" viewBox="0 -960 960 960" width="42px"
                    fill="currentColor">
                    <path
                        d="M480-260 280-460l56-56 104 104v-308h80v308l104-104 56 56-200 200ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Z" />
                </svg>
            </div>

            <div class="drop-zone-text">
                <p class="drop-zone-title">Arrastra y suelta tu imagen aquí</p>
                <p class="drop-zone-sub">o haz clic para explorar archivos</p>
            </div>

            <div class="drop-zone-meta">
                <span class="meta-bracket">[</span>
                <span class="meta-info">JPG • PNG • WEBP</span>
                <span class="meta-bracket">]</span>
            </div>
        </div>
        <div class="escenario" id="escenario">
            <img id="preview" class="preview oculto" alt="Vista previa de la imagen procesada" draggable="false">
            <div id="cropOverlay" class="crop-overlay oculto" aria-label="Área de selección del recorte">
                <div id="cropSelection" class="crop-selection oculto"></div>
            </div>
        </div>
    </main>

    <script>
        document.body.append(document.getElementById("menuImagen"));
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="{{ url_for('static', filename='visor.js') }}"></script>
</body>

</html>
